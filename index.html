<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>고객센터 AI 상담원</title>
<style>
  :root{
    --ink:#1c1b1a;
    --paper:#faf9f7;
    --line:#e4e1db;
    --accent:#2f5d50;
    --accent-soft:#e7efec;
    --user-bubble:#2f5d50;
    --bot-bubble:#ffffff;
    --muted:#7a7670;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }

  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    flex-shrink:0;
  }
  header .badge{
    display:inline-block;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 8px;
    border-radius:20px;
    margin-bottom:8px;
    font-weight:600;
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--muted);
  }

  #chat{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .bubble{
    max-width:82%;
    padding:11px 14px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .row.user .bubble{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .row.bot .bubble{
    background:var(--bot-bubble);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }

  .video-card{
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    background:#000;
  }
  .video-card iframe{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    border:0;
  }

  .thinking{
    display:flex;
    gap:4px;
    padding:12px 14px;
  }
  .thinking span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){animation-delay:.15s;}
  .thinking span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:.4;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  footer{
    flex-shrink:0;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:var(--paper);
  }
  #suggestions{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    scrollbar-width:none;
  }
  #suggestions::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    font-size:12.5px;
    color:var(--accent);
    background:var(--accent-soft);
    border:none;
    padding:7px 12px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
  }

  #inputRow{
    display:flex;
    gap:8px;
    align-items:center;
  }
  #q{
    flex:1;
    border:1px solid var(--line);
    border-radius:22px;
    padding:11px 16px;
    font-size:14.5px;
    outline:none;
    background:#fff;
  }
  #q:focus{border-color:var(--accent);}
  #send{
    flex-shrink:0;
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:16px;
    cursor:pointer;
  }
  #send:disabled{opacity:.5;}

  .error-note{
    font-size:12px;
    color:#b0452e;
    background:#fdf1ee;
    border:1px solid #f3d8d0;
    border-radius:10px;
    padding:8px 10px;
    margin-top:8px;
  }
</style>
</head>
<body>

<header>
  <span class="badge">DEMO</span>
  <h1>무엇이든 물어보세요</h1>
  <p>등록된 안내 정보를 바탕으로 답변과 관련 영상을 알려드려요.</p>
</header>

<div id="chat"></div>

<footer>
  <div id="suggestions"></div>
  <div id="inputRow">
    <input id="q" type="text" placeholder="예: 배송은 얼마나 걸리나요?" />
    <button id="send" aria-label="보내기">➤</button>
  </div>
</footer>

<script>
/* ============================================================
   ⚙️ 설정: 이 부분만 본인 값으로 바꿔주세요
   ============================================================ */
// Cloudflare Worker 배포 후 나오는 주소로 교체하세요. (가이드.md 참고)
const WORKER_URL = "https://tutorial.exchaany.workers.dev";

// Google Sheet를 사용하려면 아래 두 값을 채우세요. (가이드.md 참고)
// 시트 주소 예: https://docs.google.com/spreadsheets/d/1AbCdEfGhIJK.../edit
//                                                    └── 이 부분이 SHEET_ID
const SHEET_ID = "1J-OLkWF0Dnv2PouYuA7IbQIQ3Orhk5X2VLVhnJVlKko";
const SHEET_NAME = "Sheet1";  // ⚠️ 시트 하단 탭 이름을 확인하고 다르면 여기를 그 이름으로 바꿔주세요

/* ============================================================ */

let QNA = [];
const chatEl = document.getElementById('chat');
const qEl = document.getElementById('q');
const sendBtn = document.getElementById('send');
const suggestEl = document.getElementById('suggestions');

async function loadData(){
  if (SHEET_ID) {
    QNA = await loadFromGoogleSheet(SHEET_ID, SHEET_NAME);
  } else {
    const res = await fetch('qna-data.json');
    QNA = await res.json();
  }
  renderSuggestions();
}

// Google Sheets를 "링크 있는 사람은 볼 수 있음"으로 공유해두면
// 별도 로그인/인증 없이 JSON 형태로 데이터를 가져올 수 있습니다.
// 시트 컬럼 구조: A=번호 B=카테고리 C=쇼츠주제명 D=타겟상황 E=상세설명 F=영상URL(선택, 나중에 채워도 됨)
async function loadFromGoogleSheet(sheetId, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  const text = await res.text();
  const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const parsed = JSON.parse(jsonText);
  const rows = parsed.table.rows;

  return rows
    .map(row => {
      const cell = i => row.c[i] ? row.c[i].v : null;
      return {
        id: cell(0),
        category: cell(1),
        title: cell(2),
        situation: cell(3),
        description: cell(4),
        videoUrl: cell(5) || null,
      };
    })
    .filter(item => item.title && item.description); // 빈 줄 제외
}

function renderSuggestions(){
  suggestEl.innerHTML = '';
  QNA.slice(0, 6).forEach(item=>{
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = item.title;
    btn.onclick = ()=>{ qEl.value = item.title; ask(); };
    suggestEl.appendChild(btn);
  });
}

function addBubble(role, text){
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function addVideo(bubble, url){
  const embedUrl = toYoutubeEmbed(url);
  if(!embedUrl) return;
  const card = document.createElement('div');
  card.className = 'video-card';
  const iframe = document.createElement('iframe');
  iframe.src = embedUrl;
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
  iframe.allowFullscreen = true;
  card.appendChild(iframe);
  bubble.parentElement.appendChild(card);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function toYoutubeEmbed(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  if(!m) return null;
  return `https://www.youtube.com/embed/${m[1]}`;
}

function addThinking(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'thinkingRow';
  row.innerHTML = '<div class="bubble thinking"><span></span><span></span><span></span></div>';
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function removeThinking(){
  const t = document.getElementById('thinkingRow');
  if(t) t.remove();
}

async function ask(){
  const question = qEl.value.trim();
  if(!question) return;
  qEl.value = '';
  sendBtn.disabled = true;
  addBubble('user', question);
  addThinking();

  try{
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ question, items: QNA })
    });
    if(!res.ok) throw new Error('서버 응답 오류: ' + res.status);
    const data = await res.json();

    removeThinking();
    const bubble = addBubble('bot', data.answer || '답변을 찾지 못했어요.');
    if(data.videoUrl){
      addVideo(bubble, data.videoUrl);
    }
  }catch(err){
    removeThinking();
    const bubble = addBubble('bot', '죄송해요, 답변을 가져오는 중 문제가 생겼어요.');
    const note = document.createElement('div');
    note.className = 'error-note';
    note.textContent = 'WORKER_URL 설정을 확인해주세요 (' + err.message + ')';
    bubble.parentElement.appendChild(note);
  }finally{
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', ask);
qEl.addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });

loadData();
addBubble('bot', '안녕하세요! 무엇을 도와드릴까요? 아래 예시 질문을 눌러보셔도 좋아요.');
</script>
</body>
</html>
